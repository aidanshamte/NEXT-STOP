name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-stop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next-stop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:web
      - name: Server package installs from its own lockfile
        run: npm ci --omit=dev --ignore-scripts --prefix server
      - name: Deployment scripts
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/*.sh
      - name: Azure template compiles
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
